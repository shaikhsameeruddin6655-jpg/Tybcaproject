<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Initialize Admin - Paints Works</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .init-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            padding: 2rem;
        }
        
        .init-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        
        .init-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
        }
        
        .init-icon i {
            font-size: 1.5rem;
            color: white;
        }
        
        .btn {
            width: 100%;
            padding: 1rem;
            margin: 0.5rem 0;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: transparent;
            color: #667eea;
            border: 2px solid #667eea;
        }
        
        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }
        
        .status {
            margin: 1rem 0;
            padding: 1rem;
            border-radius: 8px;
            font-weight: 600;
        }
        
        .status.success {
            background: #d1fae5;
            color: #065f46;
        }
        
        .status.info {
            background: #dbeafe;
            color: #1e40af;
        }
    </style>
</head>
<body>
    <div class="init-container">
        <div class="init-card">
            <div class="init-icon">
                <i class="fas fa-user-shield"></i>
            </div>
            <h2>Admin Initialization</h2>
            <p id="statusMessage" class="status info">Setting up admin credentials...</p>
            
            <button id="initBtn" class="btn btn-primary" onclick="initializeAdmin()">
                <i class="fas fa-play"></i> Initialize Admin
            </button>
            
            <a href="login.html" class="btn btn-secondary" style="text-decoration: none; display: block;">
                <i class="fas fa-sign-in-alt"></i> Go to Login
            </a>
            
            <a href="index.html" class="btn btn-secondary" style="text-decoration: none; display: block;">
                <i class="fas fa-home"></i> Back to Home
            </a>
        </div>
    </div>

    <script>
        function initializeAdmin() {
            // Set default admin credentials
            const adminCredentials = {
                email: 'admin@paintsworks.com',
                password: 'admin123',
                createdAt: new Date().toISOString()
            };
            
            // Save to localStorage
            localStorage.setItem('adminCredentials', JSON.stringify(adminCredentials));
            
            // Update status
            document.getElementById('statusMessage').className = 'status success';
            document.getElementById('statusMessage').textContent = 'Admin credentials initialized successfully!';
            document.getElementById('initBtn').disabled = true;
            document.getElementById('initBtn').innerHTML = '<i class="fas fa-check"></i> Initialized';
            
            // Show credentials
            setTimeout(() => {
                alert('Admin Credentials:\nEmail: admin@paintsworks.com\nPassword: admin123\n\nThese credentials are now ready for login!');
            }, 500);
        }
        
        // Auto-check if admin already exists
        document.addEventListener('DOMContentLoaded', function() {
            const existingAdmin = JSON.parse(localStorage.getItem('adminCredentials') || '{}');
            
            if (existingAdmin.email) {
                document.getElementById('statusMessage').className = 'status success';
                document.getElementById('statusMessage').textContent = 'Admin credentials already exist!';
                document.getElementById('initBtn').disabled = true;
                document.getElementById('initBtn').innerHTML = '<i class="fas fa-check"></i> Already Initialized';
            }
        });
    </script>
</body>
</html>

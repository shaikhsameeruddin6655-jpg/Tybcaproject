<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Setup - Paints Works</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .admin-setup {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            padding: 2rem;
        }
        
        .setup-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 500px;
            width: 100%;
        }
        
        .setup-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .setup-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .setup-icon i {
            font-size: 2rem;
            color: white;
        }
        
        .setup-header h1 {
            color: #2d3748;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        
        .setup-header p {
            color: #718096;
            font-size: 1rem;
            margin: 0;
        }
        
        .current-admin {
            background: #f8fafc;
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            border-left: 4px solid #667eea;
        }
        
        .current-admin h3 {
            color: #4a5568;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }
        
        .current-admin p {
            color: #2d3748;
            font-family: monospace;
            margin: 0.25rem 0;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #4a5568;
            font-size: 0.875rem;
        }
        
        .form-label i {
            color: #667eea;
            font-size: 0.875rem;
        }
        
        .form-input {
            width: 100%;
            padding: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.8);
            color: #2d3748;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            transform: translateY(-1px);
        }
        
        .btn {
            width: 100%;
            padding: 1rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: transparent;
            color: #667eea;
            border: 2px solid #667eea;
        }
        
        .btn-secondary:hover {
            background: #667eea;
            color: white;
            transform: translateY(-1px);
        }
        
        .success-message {
            background: #d1fae5;
            color: #065f46;
            padding: 1rem;
            border-radius: 12px;
            margin-top: 1rem;
            text-align: center;
            display: none;
        }
        
        .success-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="admin-setup">
        <div class="setup-card">
            <div class="setup-header">
                <div class="setup-icon">
                    <i class="fas fa-user-shield"></i>
                </div>
                <h1>Admin Setup</h1>
                <p>Change admin credentials for Paints Works</p>
            </div>

            <div class="current-admin">
                <h3>Current Admin Credentials:</h3>
                <p>Email: <span id="currentEmail">admin@paintsworks.com</span></p>
                <p>Password: <span id="currentPassword">admin123</span></p>
            </div>

            <form id="adminSetupForm">
                <div class="form-group">
                    <label class="form-label" for="adminEmail">
                        <i class="fas fa-envelope"></i>
                        New Admin Email
                    </label>
                    <input type="email" class="form-input" id="adminEmail" name="adminEmail" 
                           required placeholder="Enter new admin email">
                </div>

                <div class="form-group">
                    <label class="form-label" for="adminPassword">
                        <i class="fas fa-lock"></i>
                        New Admin Password
                    </label>
                    <input type="password" class="form-input" id="adminPassword" name="adminPassword" 
                           required placeholder="Enter new admin password">
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmAdminPassword">
                        <i class="fas fa-lock"></i>
                        Confirm New Password
                    </label>
                    <input type="password" class="form-input" id="confirmAdminPassword" name="confirmAdminPassword" 
                           required placeholder="Confirm new admin password">
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i>
                    Update Admin Credentials
                </button>

                <a href="index.html" class="btn btn-secondary" style="text-decoration: none; display: block; text-align: center;">
                    <i class="fas fa-home"></i>
                    Back to Home
                </a>
            </form>

            <div id="successMessage" class="success-message">
                <i class="fas fa-check-circle"></i>
                Admin credentials updated successfully!
            </div>
        </div>
    </div>

    <script>
        // Initialize admin setup
        document.addEventListener('DOMContentLoaded', function() {
            loadCurrentAdmin();
            setupFormHandler();
        });

        // Load current admin credentials
        function loadCurrentAdmin() {
            const adminCredentials = JSON.parse(localStorage.getItem('adminCredentials') || '{}');
            
            if (adminCredentials.email) {
                document.getElementById('currentEmail').textContent = adminCredentials.email;
            }
            if (adminCredentials.password) {
                document.getElementById('currentPassword').textContent = adminCredentials.password;
            }
        }

        // Setup form handler
        function setupFormHandler() {
            const form = document.getElementById('adminSetupForm');
            
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const formData = new FormData(form);
                const email = formData.get('adminEmail').trim();
                const password = formData.get('adminPassword');
                const confirmPassword = formData.get('confirmAdminPassword');
                
                // Validation
                if (!email || !password || !confirmPassword) {
                    showMessage('Please fill in all fields', 'error');
                    return;
                }
                
                if (password !== confirmPassword) {
                    showMessage('Passwords do not match', 'error');
                    return;
                }
                
                if (password.length < 6) {
                    showMessage('Password must be at least 6 characters long', 'error');
                    return;
                }
                
                // Update admin credentials
                const adminCredentials = {
                    email: email,
                    password: password,
                    updatedAt: new Date().toISOString()
                };
                
                localStorage.setItem('adminCredentials', JSON.stringify(adminCredentials));
                
                // Update display
                document.getElementById('currentEmail').textContent = email;
                document.getElementById('currentPassword').textContent = password;
                
                // Show success message
                document.getElementById('successMessage').classList.add('show');
                
                // Clear form
                form.reset();
                
                // Hide success message after 3 seconds
                setTimeout(() => {
                    document.getElementById('successMessage').classList.remove('show');
                }, 3000);
            });
        }

        // Show message (for future use)
        function showMessage(message, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 1rem 1.5rem;
                background: ${type === 'error' ? '#f56565' : '#48bb78'};
                color: white;
                border-radius: 8px;
                z-index: 9999;
            `;
            messageDiv.textContent = message;
            
            document.body.appendChild(messageDiv);
            
            setTimeout(() => {
                messageDiv.remove();
            }, 3000);
        }
    </script>
</body>
</html>
